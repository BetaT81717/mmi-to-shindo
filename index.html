<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MMI <-> Shindo</title>
	<link rel="icon" type="image/x-icon" href="image/favicon.ico">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>MMI <-> Shindo Converter</h1>
	<div class="flex-container">
		<div class="mmiin">
			<label>MMI:</label>
			<br>
			<input type="text" id="mmiin" name="MMI" class="mmi">
			<button id="msub">Submit</button>
		</div>
		<div class="shindoin">
			<label>Shindo:</label>
			<br>
			<input type="text" id="shindoin" name="Shindo" class="shindo">
			<button id="ssub">Submit</button>
		</div>
	</div>
	<p id="errordisp" class="error"></p>
	<script src="script.js"></script>
	<div class="botmbar">
		<span>Made by <a href="https://github.com/BetaT81717/" style="color: white;">BetaT81717</a></span>
		<a href="https://github.com/BetaT81717/mmi-to-shindo"><img src="image/github_favicon.png" style="filter: invert(1);"></a>
	</div>
</body>
</html>
